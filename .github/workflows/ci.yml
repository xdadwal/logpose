name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      # The suite is hermetic: every provider is exercised through a mock
      # transport or a scripted FakeProvider, so CI needs no credentials.
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Ruff
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy src/

  build:
    name: build and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      # Guards the promise that `import logpose` pulls in no provider SDK,
      # reads no credential, and makes no network call.
      - name: Install the wheel standalone and check import purity
        run: |
          uv venv /tmp/check
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          /tmp/check/bin/python -c "
          import sys, logpose
          assert 'anthropic' not in sys.modules, 'anthropic must not be imported eagerly'
          assert 'httpx' not in sys.modules, 'httpx must not be imported eagerly'
          print('logpose', logpose.__version__, 'imports clean')
          "

      - name: Check base install provider boundaries
        run: |
          /tmp/check/bin/python -c "
          import logpose
          from logpose.errors import LogposeError
          logpose.resolve('openai', api_key='not-a-real-key')
          logpose.resolve('codex', auth_token='not-a-real-token', account_id='account')
          logpose.resolve('docker')
          try:
              logpose.resolve('anthropic', api_key='not-a-real-key')
          except LogposeError as exc:
              assert 'logpose[anthropic]' in str(exc)
          else:
              raise AssertionError('Anthropic resolved without its optional extra')
          print('base provider boundaries clean')
          "
