[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpose"
version = "0.1.0"
description = "A universal agentic loop that services embed."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: an SPDX expression, not the licence body. `license = {file=...}`
# inlines the whole MIT text into the `License:` metadata field, which renders
# verbatim on PyPI and reads as "unknown" to scanners keyed on License-Expression.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akshay Dadwal", email = "akshay.dadwal.rajput@gmail.com" }]
keywords = ["agent", "agentic", "llm", "anthropic", "claude", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # 0.49 is the first release whose `messages.stream()` accepts `thinking`,
    # which the Anthropic provider sends on every request by default. Older
    # versions resolve fine and then TypeError on the first call.
    "anthropic>=0.49",
    "pydantic>=2",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/xdadwal/logpose"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/logpose"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
